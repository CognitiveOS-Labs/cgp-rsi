name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package + dev deps
        run: pip install -e '.[dev]'
      - name: Unit tests
        run: pytest -q
      - name: Mock end-to-end pipeline (MOCK artifacts, no claims)
        run: python3 scripts/mock_e2e.py --out runs/mock-e2e
      - name: Gate rejection path (MOCK)
        run: python3 scripts/mock_e2e.py --out runs/mock-e2e-fail --fail-at 1

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install cpm
        run: go install github.com/CognitiveOS-Project/cpm/cmd/cpm@v1.0.9-alpha
      - name: Verify anchors pass the verifier
        run: |
          pip install -e .
          python3 -c "
          import json, sys
          from rsi.verifier import verify_candidate
          ok = True
          for line in open('data/anchors.jsonl'):
              item = json.loads(line)
              v = verify_candidate(item['problem'], item['solution'])
              ok = ok and v.passed
          sys.exit(0 if ok else 1)
          "
      - name: Pack + verify .cgp packages
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd packages/base-model-v0 && cpm pack --manifest cognitive.json && cpm verify base-model-v0-*.cgp
          cd ../rsi-controller && chmod 755 tools/rsi-controller && cpm pack --bin tools && cpm verify rsi-controller-*.cgp
      - name: Upload .cgp artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cgp-packages
          path: packages/*/*.cgp
