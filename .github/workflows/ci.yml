name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    # Python-only job: no cpm, runs on ubuntu.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package + dev deps
        run: pip install -e '.[dev]'
      - name: Unit tests
        run: pytest -q
      - name: Mock end-to-end pipeline (MOCK artifacts, no claims)
        run: python3 scripts/mock_e2e.py --out runs/mock-e2e
      - name: Gate rejection path (MOCK)
        run: python3 scripts/mock_e2e.py --out runs/mock-e2e-fail --fail-at 1

  package:
    # CognitiveOS is Alpine-based — all cpm steps run inside the encapsulated
    # Alpine image (see .github/docker/Dockerfile.ci).
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build encapsulated Alpine image (anchors + cpm pack/verify)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile.ci
          platforms: linux/amd64
          load: true
          tags: cgp-ci:local
      - name: Extract .cgp artifacts
        run: |
          id=$(docker create cgp-ci:local)
          docker cp "$id":/out ./out
          docker rm "$id"
          ls -la out/
      - name: Upload .cgp artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cgp-packages
          path: out/*.cgp
