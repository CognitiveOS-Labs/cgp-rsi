name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install cpm
        run: go install github.com/CognitiveOS-Project/cpm/cmd/cpm@v1.0.9-alpha
      - name: Pack + verify .cgp packages
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd packages/base-model-v0 && cpm pack --manifest cognitive.json && cpm verify base-model-v0-*.cgp
          cd ../rsi-controller && chmod 755 tools/rsi-controller && cpm pack --bin tools && cpm verify rsi-controller-*.cgp
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*/*.cgp
          generate_release_notes: true
