name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    # Build inside the encapsulated Alpine image — cpm and the verifier run
    # in the same environment CognitiveOS packages ship in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build encapsulated Alpine image (cpm pack + verify)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile.ci
          platforms: linux/amd64
          load: true
          tags: cgp-ci:local
      - name: Extract .cgp artifacts
        run: |
          id=$(docker create cgp-ci:local)
          docker cp "$id":/out ./out
          docker rm "$id"
          ls -la out/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.cgp
          generate_release_notes: true
